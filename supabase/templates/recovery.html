<h2>Reset your ALCL password</h2>
<p>Follow this link to choose a new password for your player account:</p>
<p><a href="{{ .SiteURL }}/auth/recovery?token_hash={{ .TokenHash }}&type=recovery">Reset password</a></p>
<p>This link expires in about an hour and can only be used once.</p>
<p>If you did not request a password reset, you can ignore this email.</p>
